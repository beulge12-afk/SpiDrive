# Runs the tests on every push and pull request. They use a fake Telegram, so no account is needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -r requirements.txt pytest pytest-aiohttp
      - name: Run tests
        run: python -m pytest -q
